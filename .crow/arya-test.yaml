# Independent client checks against live Penny. Does not deploy this commit.
when:
  - event: [push, manual]
labels:
  backend: docker
  platform: linux/amd64
clone:
  hermes-converse:
    image: codefloe.com/crow-plugins/clone:1.0.3
  arya-test:
    image: codefloe.com/crow-plugins/clone:1.0.3
    settings:
      remote: https://github.com/Keryxion/arya-test.git
      path: ${CI_WORKSPACE}/arya-test
      sha: 759e6e36c845d3de9a674eeb91beecf3c0a4a5c3
      partial: false
      depth: 1
steps:
  - name: live-penny-free
    image: python:3.13-slim
    environment:
      ARYA_API_KEY: { from_secret: arya_penny_api_key }
      ARYA_URL: wss://penny.z13.org/v1/audio/converse
      ARYA_SPEC_FILE: ${CI_WORKSPACE}/specs/client.md
    commands:
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends espeak-ng ffmpeg libopus0
      - cd arya-test && sh ci/run.sh
