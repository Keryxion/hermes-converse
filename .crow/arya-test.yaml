# Live Penny contract check. Suite: Keryxion/arya-test main, cloned on each run.
# Run only after the alpha workflow successfully deploys to Penny.
when:
  - event: deployment
    environment: penny
depends_on:
  - alpha
labels:
  backend: docker
  platform: linux/arm64
steps:
  - name: live-penny-free
    image: python:3.13-slim
    environment:
      ARYA_API_KEY: { from_secret: arya_penny_api_key }
      # Lets the suite post its report as a comment on the deployed pull request.
      GITHUB_TOKEN: { from_secret: arya_report_github_token }
      ARYA_URL: wss://penny.z13.org/v1/audio/converse
    commands:
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends espeak-ng ffmpeg git libopus0
      - git clone -q --depth 1 https://github.com/Keryxion/arya-test
      - cd arya-test && sh ci/run.sh
