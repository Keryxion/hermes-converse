# Alpha deploys. .github/workflows/alpha.yml turns an alpha:<host> label on a PR into a
# GitHub deployment of the PR's head commit to environment <host>; this runs on that
# deployment and ssh's to the host with a key that can only run deploy/hermes-converse-alpha.
# The ssh config (host names), key and known_hosts are Crow secrets; see deploy/README.md.

when:
  - event: deployment
    environment: [sakura, penny, hermie]

labels:
  backend: docker
  platform: linux/amd64

skip_clone: true

steps:
  - name: deploy
    image: alpine:3
    environment:
      ALPHA_SSH_CONFIG: { from_secret: alpha_ssh_config }
      ALPHA_SSH_KEY: { from_secret: alpha_ssh_key }
      ALPHA_KNOWN_HOSTS: { from_secret: alpha_known_hosts }
    commands:
      # $$ keeps Crow from substituting these before the secrets are in the environment.
      - apk add -q --no-cache openssh-client
      - mkdir -m 700 -p ~/.ssh
      - printf '%s\n' "$${ALPHA_SSH_CONFIG}" > ~/.ssh/config
      - printf '%s\n' "$${ALPHA_SSH_KEY}" > ~/.ssh/alpha && chmod 600 ~/.ssh/alpha
      - printf '%s\n' "$${ALPHA_KNOWN_HOSTS}" > ~/.ssh/known_hosts
      - ssh -o BatchMode=yes "$${CI_PIPELINE_DEPLOY_TARGET}" deploy "$${CI_COMMIT_SHA}"
