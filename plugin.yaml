# hermes-converse — server-owned realtime voice over one WebSocket on the Hermes API server.
name: hermes-converse
version: 0.1.0
manifest_version: 2
api_version: 1
kind: standalone
description: >-
  Off-device realtime voice: GET /v1/audio/converse on the API server. A client streams
  microphone PCM16 up one WebSocket; the plugin owns VAD, endpointing, STT, the agent turn
  (through the public Runs API, so the session, tools and approvals stay Hermes's) and
  per-sentence streaming TTS back down the same socket, with barge-in. Built for an ESP32
  or a browser that has a microphone and a speaker and nothing else.
author: "Darrell (@DTTerastar)"
license: MIT
homepage: https://github.com/Keryxion/hermes-converse
tags: [voice, api_server, realtime, websocket, esp32]
requires_hermes: ">=0.21.6"
# ONNX Runtime supports default Silero VAD and optional Smart Turn endpointing.
python_dependencies:
  - "numpy>=2,<3"
  - "av>=14,<20"
  # ONNX Runtime has no current Intel macOS or Android wheels. Those hosts keep the
  # fixed endpoint; do not make the whole voice plugin uninstallable there.
  - "onnxruntime>=1.20,<2; (sys_platform != 'darwin' or platform_machine != 'x86_64') and sys_platform != 'android'"
  - "transformers>=4.46,<6"
  - "huggingface_hub>=0.26,<2"
provides_tools: []
provides_hooks: [post_llm_call]
config_schema:
  vad_model:
    type: str
    choices: [silero, energy]
    default: silero
    description: "Speech detection: Silero with automatic energy fallback, or energy only. Smart Turn is configured separately."
  name:
    type: str
    default: "Arya"
    label: "Assistant name"
    description: "Name the voice prompt uses when a client's start frame carries none."
  voice_model:
    type: str
    default: ""
    description: "Voice-only model override sent with every run ('' = the gateway default)."
  voice_provider:
    type: str
    default: ""
    description: "Provider for the voice-only model override ('' = the configured one)."
  turn_timeout_seconds:
    type: float
    default: 120
    description: "A turn that produces nothing for this long is stopped and reported as an error."
  playback_tail_timeout_seconds:
    type: float
    default: 45
    description: "How long to hold VAD/quiet after turn_done waiting for the client's drained frame."
  max_tts_chars_per_turn:
    type: int
    default: 1500
    description: "Safety cap on how much of one reply is spoken aloud."
  end_phrases:
    type: list
    default: ["over and out"]
    description: "Session mode: a reply ending with one of these signs off (turn_done.next_action=standby)."
  endpoint_model:
    type: str
    default: ""
    description: "Smart Turn v3 semantic endpointer: any value enables it (needs onnxruntime, transformers, huggingface_hub)."
  endpoint_threshold:
    type: float
    default: 0.5
    description: "P(turn complete) at or above which Smart Turn commits the utterance."
  approval_choice:
    type: str
    choices: [deny, once]
    default: deny
    description: "What a voice turn answers when the agent asks for a command approval."
  api_base_url:
    type: str
    default: ""
    description: "Loopback base URL of this API server ('' = derived from the listener, e.g. http://127.0.0.1:8642)."
  arbitrate_enabled:
    type: bool
    default: false
    description: "Enable advisory wake selection for cooperating clients; streamed audio is always processed."
  arbitrate_policy:
    type: str
    choices: [first_to_endpoint, wake_signal]
    default: wake_signal
    description: "wake_signal ranks exact-phrase wake claims by confidence, normalized volume, detection time, then arrival order. Legacy first_to_endpoint grants immediately."
  arbitrate_device_id:
    type: str
    default: ""
    description: "Optional label prefix for unique server-generated socket device ids."
  arbitrate_wake_window_seconds:
    type: float
    default: 0.75
    description: "How long the arbitrator collects concurrent wake claims for the same wake word before electing the primary device."
